<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | AFLOR</title>
  <!--
    O GitHub Pages serve o 404 em qualquer profundidade de URL, então caminhos relativos simples quebrariam.
    A <base> abaixo resolve tudo a partir da raiz do projeto. ÚNICA linha a trocar:
      • GitHub Pages (validação): /AFLOR/
      • Domínio próprio (produção): /
  -->
  <base href="/AFLOR/">
  <link rel="icon" href="assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main id="conteudo" class="page-hero">
    <div class="lazur" aria-hidden="true"><span class="l1"></span><span class="l2"></span><span class="l3"></span></div>
    <div class="container">
      <p class="eyebrow">Erro 404</p>
      <h1>Esta semente <em>ainda não brotou</em></h1>
      <p>A página que você procura mudou de lugar ou não existe mais. Que tal voltar e conhecer a AFLOR?</p>
      <p><a class="btn" href="./">Ir para a página inicial</a></p>
      <p><a href="./#faca-parte">Quero fazer parte da AFLOR</a></p>
    </div>
  </main>
</body>
</html>
